<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafe OCC</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- ヘッダー -->
   <header>
        <h1>Cafe OCC</h1>

       <nav>
          <a href="#about">about</a>
          <a href="#menu">menu</a>
          <a href="#access">access</a>
       </nav>

       <button>テーマ変更</button>
   </header> 

   <!-- メイン -->
   <main>
        <section id="hero">
            <h2>朝の光と、一杯のコーヒー。</h2>
            <p>静かな時間をお届けする街のカフェ</p>
        </section>

        <section id="about">
            <h2>About</h2>
            <p>2026年オープン。豆の香りと木の温もりに包まれた小さな空間で、ゆったりとした時間をお過ごしいただけます。</p>
            <p>お一人でも、ご家族でも、お気軽にどうぞ。</p>
        </section>

        <!-- menu section -->
        <section id="menu">
            <h2>Menu</h2>

                <div class="recommend">
                    <h3>今日のおすすめは？</h3>
                    <p>気分が決まらないときは、おまかせで一品ご提案します。</p>
                    <button onclick="pickRecommend()" class="recommend-btn">☕ おすすめを見る</button>
                </div>
        </section>
   </main>

   <!-- フッター -->
   <footer>

   </footer>
</body>
</html>
