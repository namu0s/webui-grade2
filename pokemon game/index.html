<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokeBattle Game</title>
    <style>
        body {
            background: radial-gradient(circle, #243b55, #141e30);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            min-height: 100vh;
        }
        #game-status { font-size: 1.5rem; font-weight: bold; text-align: center; margin: 20px; color: #00f2fe; text-shadow: 0 0 10px rgba(0, 242, 254, 0.5); }
        #game-container { text-align: center; position: relative; }
        canvas { border: 4px solid #333; background: #1a1a2e; display: none; margin: 0 auto; background-image: linear-gradient(0deg, transparent 24%, rgba(30,144,255,.1) 25%, rgba(30,144,255,.1) 26%, transparent 27%, transparent 74%, rgba(30,144,255,.1) 75%, rgba(30,144,255,.1) 76%, transparent 77%, transparent), linear-gradient(90deg, transparent 24%, rgba(30,144,255,.1) 25%, rgba(30,144,255,.1) 26%, transparent 27%, transparent 74%, rgba(30,144,255,.1) 75%, rgba(30,144,255,.1) 76%, transparent 77%, transparent); background-size: 50px 50px; box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
        .controls-hint { margin-top: 10px; color: #bbbbbb; font-size: 0.9em; }
        #section1-btn {
            background-color: #4CAF50;
            color: rgb(233, 211, 211);
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        #section1-btn:hover { background-color: #45a049; }
    </style>
</head>
<body>
    <header style="text-align: center;">
        <h1>PokeShooter Defender</h1>
        <p>Type a Pokémon name to choose your character!</p>
        <input id="name" list="pokemon-suggestions" placeholder="Pikachu, Charizard...">
        <datalist id="pokemon-suggestions"></datalist>
        <button id="section1-btn">Start Game</button>
    </header>

    <div id="game-status">Choose your Pokémon!</div>

    <div id="game-container">
        <canvas id="gameCanvas" width="600" height="400"></canvas>
        <div class="controls-hint">Use <b>Left/Right Arrows</b> to move and <b>Spacebar</b> to shoot!</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
